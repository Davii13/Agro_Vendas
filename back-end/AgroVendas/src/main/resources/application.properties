# Database. Credentials have no default on purpose: the application refuses to start without them.
# Either DB_URL (a full JDBC URL) or the parts DB_HOST / DB_PORT / DB_NAME (what Render provides).
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:agrovendas}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Allows the migration to be introduced safely in installations that already
# have the tables created by Hibernate.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.thymeleaf.check-template-location=false

# JWT. There is no default secret: JWT_SECRET must be a random value of at least 64 bytes.
jwt.secret=${JWT_SECRET}
jwt.expiration.access=${JWT_EXPIRATION_ACCESS:900}
jwt.expiration.refresh=${JWT_EXPIRATION_REFRESH:604800}

# Browser origins allowed to call the API (comma separated).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Failed-login limits (per e-mail and per client address) inside the sliding window.
app.security.login.max-attempts-per-email=${LOGIN_MAX_ATTEMPTS_PER_EMAIL:5}
app.security.login.max-attempts-per-ip=${LOGIN_MAX_ATTEMPTS_PER_IP:30}
app.security.login.window-seconds=${LOGIN_WINDOW_SECONDS:900}

# First administrator. Only used when no active ADMIN exists: ADMIN_EMAIL promotes an
# existing account; if the account does not exist, ADMIN_PASSWORD is used to create it.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.nome=${ADMIN_NOME:Administrador}

# Use "native" when the API runs behind a reverse proxy, so the client address is the real one.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Hosting platforms (Render, Heroku...) tell the app which port to listen on through PORT.
server.port=${PORT:8080}

# Never put internals in error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
