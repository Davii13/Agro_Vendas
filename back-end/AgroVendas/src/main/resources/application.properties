spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/agrovendas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Allows the migration to be introduced safely in installations that already
# have the tables created by Hibernate.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT Configuration
jwt.secret=${JWT_SECRET:SuaChaveSecretaMuitoForteComPeloMenos256BitsParaHMACSHA256SuaChaveSecretaMuitoForteComPeloMenos256Bits}
jwt.expiration.access=${JWT_EXPIRATION_ACCESS:900}
jwt.expiration.refresh=${JWT_EXPIRATION_REFRESH:604800}
