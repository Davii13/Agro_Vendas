# Test configuration: an in-memory database, so tests never touch real data. This file replaces
# the main application.properties on the test classpath. jwt.secret is generated per run by
# AbstractIntegrationTest and is never stored.
spring.datasource.url=jdbc:h2:mem:agrovendas;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.thymeleaf.check-template-location=false

jwt.expiration.access=900
jwt.expiration.refresh=604800

app.cors.allowed-origins=http://localhost:3000
app.security.login.max-attempts-per-email=5
app.security.login.max-attempts-per-ip=1000
app.security.login.window-seconds=900
app.admin.email=
app.admin.password=
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
